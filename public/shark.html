<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark AI - 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #001122;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 24px;
            text-shadow: 0 0 20px #00ffff;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Загрузка акулы...</div>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, shark, mixer;
        let targetPosition = new THREE.Vector3();
        let currentPosition = new THREE.Vector3();
        let isAttacking = false;
        let attackTimer = 0;
        let nextTargetTime = 0;
        let clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001122);
            scene.fog = new THREE.FogExp2(0x001122, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x334466, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0x00ffff, 1.2);
            mainLight.position.set(5, 10, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const secondaryLight = new THREE.DirectionalLight(0x0088ff, 0.6);
            secondaryLight.position.set(-5, 5, -5);
            scene.add(secondaryLight);

            const pointLight1 = new THREE.PointLight(0x00ffff, 1, 50);
            pointLight1.position.set(0, 10, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x0066ff, 0.8, 40);
            pointLight2.position.set(-10, 5, 10);
            scene.add(pointLight2);

            createLightRays();

            const loader = new GLTFLoader();
            loader.load(
                'models/shark.glb',
                (gltf) => {
                    shark = gltf.scene;
                    shark.scale.set(1, 1, 1);
                    shark.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    scene.add(shark);
                    currentPosition.set(0, 0, 0);
                    setNewTarget();
                    document.getElementById('loading').style.display = 'none';
                },
                undefined,
                (error) => {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').textContent = 'Ошибка загрузки модели';
                }
            );

            window.addEventListener('resize', onWindowResize);
        }

        function createLightRays() {
            const rayGeometry = new THREE.CylinderGeometry(0.1, 2, 30, 8, 1, true);
            const rayMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.03,
                side: THREE.DoubleSide
            });

            for (let i = 0; i < 5; i++) {
                const ray = new THREE.Mesh(rayGeometry, rayMaterial.clone());
                ray.position.set(
                    (Math.random() - 0.5) * 20,
                    15,
                    (Math.random() - 0.5) * 20
                );
                ray.rotation.x = Math.PI;
                ray.rotation.z = (Math.random() - 0.5) * 0.3;
                scene.add(ray);
            }
        }

        function setNewTarget() {
            const range = 8;
            targetPosition.set(
                (Math.random() - 0.5) * range * 2,
                (Math.random() - 0.5) * 4,
                (Math.random() - 0.5) * range * 2
            );
            nextTargetTime = 3 + Math.random() * 2;
        }

        function setAttackTarget() {
            const distance = 3 + Math.random() * 2;
            const angle = Math.random() * Math.PI * 2;
            targetPosition.set(
                Math.cos(angle) * distance,
                (Math.random() - 0.5) * 2,
                Math.sin(angle) * distance
            );
        }

        function updateShark(delta) {
            if (!shark) return;

            const speed = isAttacking ? 4 : 1.5;
            const direction = new THREE.Vector3().subVectors(targetPosition, shark.position);
            const distance = direction.length();

            if (distance > 0.1) {
                direction.normalize();
                shark.position.add(direction.multiplyScalar(speed * delta));

                const targetRotation = Math.atan2(direction.x, direction.z);
                shark.rotation.y = THREE.MathUtils.lerp(
                    shark.rotation.y,
                    targetRotation,
                    delta * 3
                );

                const pitchAngle = Math.atan2(direction.y, Math.sqrt(direction.x * direction.x + direction.z * direction.z));
                shark.rotation.x = THREE.MathUtils.lerp(shark.rotation.x, pitchAngle * 0.5, delta * 2);
            }

            if (isAttacking) {
                attackTimer -= delta;
                if (attackTimer <= 0) {
                    isAttacking = false;
                    setNewTarget();
                }
            } else {
                nextTargetTime -= delta;
                if (nextTargetTime <= 0) {
                    if (Math.random() < 0.3) {
                        isAttacking = true;
                        attackTimer = 2 + Math.random() * 2;
                        setAttackTarget();
                    } else {
                        setNewTarget();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            updateShark(delta);

            camera.position.x = Math.sin(Date.now() * 0.0002) * 0.5;
            camera.position.y = 2 + Math.sin(Date.now() * 0.0003) * 0.3;
            camera.lookAt(shark ? shark.position : new THREE.Vector3(0, 0, 0));

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
